<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MC Club | Método Crescer</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#1B1446;--lilac:#EFEBFF;--paper:#fff;--sun:#FFC93C;--coral:#FF4F7B;--muted:#5E5880;--line:#D9D3F5;--ok:#1E9E6A}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--lilac);color:var(--ink);font-family:Figtree,system-ui,sans-serif;font-size:17px;line-height:1.55;-webkit-font-smoothing:antialiased;overflow-x:hidden}
.wrap{width:100%;max-width:480px;margin:0 auto;padding-left:18px;padding-right:18px}
h1,h2,h3{font-family:"Bricolage Grotesque",sans-serif;line-height:1.05;letter-spacing:-.02em}
h1{font-size:clamp(2.1rem,9vw,2.9rem);font-weight:800}
h2{font-size:clamp(1.6rem,7vw,2.1rem);font-weight:800}
h3{font-size:1.15rem}
.muted{color:var(--muted)}
button,input{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--coral);outline-offset:3px;border-radius:6px}
.hidden{display:none!important}
.btn{display:flex;align-items:center;justify-content:center;width:100%;min-height:58px;padding:14px 22px;border:0;border-radius:16px;cursor:pointer;font-family:"Bricolage Grotesque";font-weight:700;font-size:1.15rem;text-decoration:none}
.btn-ink{background:var(--ink);color:#fff}
.btn-sun{background:var(--sun);color:var(--ink);box-shadow:0 6px 0 #D9A41A;animation:pulse 2.4s infinite}
.btn-sun:active{box-shadow:0 2px 0 #D9A41A;transform:translateY(4px)}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.03)}}
.link{background:none;border:0;color:var(--muted);text-decoration:underline;cursor:pointer;padding:10px;font-size:.95rem}

/* Telas centralizadas (início e quiz) */
.screen{min-height:100svh;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding-top:28px;padding-bottom:28px}
.screen p{margin-left:auto;margin-right:auto;max-width:34ch}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;margin-bottom:18px}
.brand b{width:38px;height:38px;border-radius:12px;background:var(--ink);color:var(--sun);display:grid;place-items:center;font-family:"Bricolage Grotesque"}
.hero-art{width:100%;max-width:300px;margin-bottom:18px}
#intro h1{margin-bottom:12px}
#intro p{margin-bottom:24px;font-size:1.05rem}

/* Quiz */
.progress{width:100%;display:flex;align-items:center;gap:12px;margin-bottom:22px;font-weight:600;color:var(--muted);font-size:.95rem}
.bar{flex:1;height:10px;background:var(--line);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--ink);border-radius:99px;transition:width .35s}
.q-art{width:110px;height:110px;margin-bottom:14px}
#q-title{margin-bottom:8px}
#q-help{margin-bottom:22px}
.options{width:100%;display:grid;gap:12px}
.opt{width:100%;padding:17px;border-radius:16px;background:var(--paper);border:2px solid transparent;font-weight:600;cursor:pointer;text-align:center;transition:transform .15s,border-color .15s}
.opt:active{transform:scale(.97)}
.opt.picked{border-color:var(--ink);background:#FFF8DF}
.q-in{animation:qin .35s ease}
@keyframes qin{from{opacity:0;transform:translateX(24px)}to{opacity:1;transform:none}}

/* Animações das ilustrações */
.float{animation:float 3s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.rise{animation:rise 2.6s ease-in infinite;opacity:0}
@keyframes rise{0%{opacity:0;transform:translateY(0) scale(.6)}20%{opacity:1}100%{opacity:0;transform:translateY(-70px) scale(1.1)}}
.grow{transform-origin:bottom;transform-box:fill-box;animation:grow 1.8s ease-out infinite alternate}
@keyframes grow{from{transform:scaleY(.35)}to{transform:scaleY(1)}}
.spin{transform-origin:center;transform-box:fill-box;animation:spin 8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* Diagnóstico */
#resultado{padding-top:28px}
.report{background:var(--ink);color:#fff;border-radius:26px;padding:26px 20px;text-align:center}
.tag{display:inline-block;background:var(--sun);color:var(--ink);font-weight:700;font-size:.88rem;padding:5px 12px;border-radius:99px;margin-bottom:14px}
.report p{color:#D8D3F7;margin-top:10px}
.gauge{width:180px;margin:18px auto 4px;display:block}
.meters{display:grid;gap:14px;margin-top:18px;text-align:left}
.meter-top{display:flex;justify-content:space-between;font-weight:600;font-size:.95rem;margin-bottom:6px}
.meter-track{height:12px;background:rgba(255,255,255,.15);border-radius:99px;overflow:hidden}
.meter-track i{display:block;height:100%;width:0;background:#fff;border-radius:99px;transition:width 1.1s cubic-bezier(.2,.8,.2,1)}
.weak .meter-track i{background:var(--coral)}
.weak em{color:#FF9DB5;font-style:normal}
.focus{background:var(--paper);border-radius:20px;padding:20px;margin-top:16px;border-left:6px solid var(--coral)}
.focus h3{margin-bottom:6px}

/* Vendas */
.block{padding-top:44px;text-align:center}
.block>h2{margin-bottom:12px}
.block>p{margin:0 auto 10px;max-width:36ch}
.block-art{width:100%;max-width:280px;margin:0 auto 16px;display:block}
.modules{list-style:none;display:grid;gap:12px;margin-top:20px;text-align:left}
.modules li{display:flex;gap:14px;align-items:flex-start;background:var(--paper);border-radius:18px;padding:16px;cursor:pointer;transition:transform .15s}
.modules li:active{transform:scale(.98)}
.modules svg{flex:none;width:46px;height:46px}
.modules strong{display:block;line-height:1.25}
.modules span{display:none;color:var(--muted);font-size:.94rem;margin-top:4px}
.modules li.open span{display:block}
.modules li.rec{outline:2px solid var(--coral)}
.pill{display:block;margin-top:6px;font-size:.8rem;font-weight:700;color:var(--coral);font-style:normal}
.checks{list-style:none;display:grid;gap:10px;margin-top:16px;text-align:left}
.checks li{background:var(--paper);border-radius:14px;padding:14px 14px 14px 48px;position:relative}
.checks li::before{content:"✓";position:absolute;left:14px;top:13px;width:24px;height:24px;border-radius:50%;background:var(--sun);display:grid;place-items:center;font-weight:800;font-size:.85rem}

/* Oferta */
#oferta{padding-top:44px}
.offer{background:var(--paper);border:2px solid var(--ink);border-radius:26px;padding:24px 18px;text-align:center}
.price{margin:16px 0 18px}
.from{color:var(--muted);font-weight:600}
.now{font-family:"Bricolage Grotesque";font-weight:800;line-height:1;display:flex;justify-content:center;align-items:baseline;gap:6px}
.now small{font-size:1.4rem}.now b{font-size:4rem}
.unlocked .now{color:var(--coral);animation:pop .5s}
@keyframes pop{50%{transform:scale(1.2)}}
.code{margin-top:20px;padding:16px;border-radius:18px;background:var(--lilac)}
.code label{display:block;font-weight:700}
.code p{font-size:.92rem;color:var(--muted);margin:4px 0 12px}
.code-row{display:flex;gap:8px}
.code-row input{flex:1;min-width:0;height:52px;border-radius:12px;border:2px solid var(--line);padding:0 14px;font-weight:700;text-transform:uppercase;text-align:center;letter-spacing:.1em}
.code-row button{height:52px;padding:0 16px;border-radius:12px;border:0;background:var(--ink);color:#fff;font-weight:700;cursor:pointer}
.code-msg{margin-top:10px;font-weight:600;font-size:.94rem;min-height:1.2em}
.err{color:#C42452}.ok{color:var(--ok)}
.shake{animation:shake .4s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.unlocked .code{background:#E3F6EC}
.safe{margin-top:14px;font-size:.9rem;color:var(--muted)}
.confetti{position:fixed;top:-10px;width:10px;height:14px;z-index:50;pointer-events:none;animation:fall 1.8s linear forwards}
@keyframes fall{to{transform:translateY(105vh) rotate(720deg)}}
details{background:var(--paper);border-radius:16px;padding:0 18px;margin-top:10px;text-align:left}
summary{cursor:pointer;padding:16px 0;font-weight:700}
details p{padding-bottom:16px;color:var(--muted)}
footer{padding-top:40px;padding-bottom:110px;text-align:center;font-size:.88rem;color:var(--muted)}
.sticky{position:fixed;left:0;right:0;bottom:0;z-index:10;background:rgba(239,235,255,.95);backdrop-filter:blur(10px);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom));transform:translateY(110%);transition:transform .3s}
.sticky.show{transform:none}
.sticky-in{max-width:480px;margin:0 auto;display:flex;align-items:center;gap:12px}
.sticky-price{font-family:"Bricolage Grotesque";font-weight:800;font-size:1.35rem;white-space:nowrap}
.sticky .btn{min-height:50px;font-size:1rem;animation:none}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
